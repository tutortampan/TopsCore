<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <meta name="googlebot" content="notranslate" />
  <meta name="robots" content="notranslate" />
  <meta http-equiv="Content-Language" content="en" />
  <title>Student Gate — TOPS CORE</title>
  <meta name="description" content="Login to Student Gate on TOPS CORE to access your English tests, track your progress, and complete tests." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=20261115_v518" />
  <link rel="stylesheet" href="css/auth.css?v=20261114_v481" />
  <!-- Web App Manifest & PWA Metadata -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#060911" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TopsCore" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
</head>
<body class="notranslate" translate="no">


  <!-- Ambient orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

   <!-- --- ONE-PAGE LOGIN --- -->
  <div class="login-page">
    <div class="login-wrapper" role="main">
      <!-- Brand -->
      <div class="login-brand">
        <div class="brand-badge-wrap" aria-hidden="true">
          <svg class="brand-book-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
          </svg>
        </div>
        <h1 class="brand-title">TOPS <span class="brand-core">CORE</span></h1>
      </div>

      <!-- --- SECTION 1: Institution --- -->
      <div class="cascade-section unlocked" id="sec-institution">
        <div class="cascade-inner">
          <div class="cascade-header">
            <div class="cascade-step-num" id="step-num-1">1</div>
            <div class="cascade-title-wrap">
              <span class="cascade-label">Institution</span><span class="cascade-colon">:</span>
              <span class="cascade-selection-label" id="sel-institution-label"></span>
            </div>
            <button class="cascade-change-btn hidden" id="change-institution-btn">Change</button>
          </div>
          <div class="cascade-body" id="body-institution">
            <div class="cascade-search">
              <span class="search-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
              <input type="text" id="search-institution" placeholder="Search institution..." autocomplete="off" />
            </div>
            <div class="options-grid" id="list-institution" role="list" aria-label="Institutions">
              <div class="opts-spinner"><div class="spinner"></div></div>
            </div>
          </div>
        </div>
      </div>

      <!-- --- SECTION 2: Class --- -->
      <div class="cascade-section" id="sec-program">
        <div class="cascade-inner">
          <div class="cascade-header">
            <div class="cascade-step-num" id="step-num-2">2</div>
            <div class="cascade-title-wrap">
              <span class="cascade-label">Program</span><span class="cascade-colon">:</span>
              <span class="cascade-selection-label" id="sel-program-label"></span>
            </div>
            <button class="cascade-change-btn hidden" id="change-program-btn">Change</button>
          </div>
          <div class="cascade-body" id="body-program">
            <div class="cascade-search">
              <span class="search-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
              <input type="text" id="search-program" placeholder="Search program..." autocomplete="off" />
            </div>
            <div class="options-grid" id="list-program" role="list" aria-label="Programs">
              <div class="opts-empty">Select an institution first</div>
            </div>
          </div>
        </div>
      </div>

      <!-- --- SECTION 3: Batch --- -->
      <div class="cascade-section" id="sec-batch">
        <div class="cascade-inner">
          <div class="cascade-header">
            <div class="cascade-step-num" id="step-num-3">3</div>
            <div class="cascade-title-wrap">
              <span class="cascade-label">Batch</span><span class="cascade-colon">:</span>
              <span class="cascade-selection-label" id="sel-batch-label"></span>
            </div>
            <button class="cascade-change-btn hidden" id="change-batch-btn">Change</button>
          </div>
          <div class="cascade-body" id="body-batch">
            <div class="cascade-search">
              <span class="search-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
              <input type="text" id="search-batch" placeholder="Search batch..." autocomplete="off" />
            </div>
            <div class="options-grid" id="list-batch" role="list" aria-label="Batches">
              <div class="opts-empty">Select a program first</div>
            </div>
          </div>
        </div>
      </div>

      <!-- --- SECTION 4: Student Name --- -->
      <div class="cascade-section" id="sec-student">
        <div class="cascade-inner">
          <div class="cascade-header">
            <div class="cascade-step-num" id="step-num-4">4</div>
            <div class="cascade-title-wrap">
              <span class="cascade-label">Name</span><span class="cascade-colon">:</span>
              <span class="cascade-selection-label" id="sel-student-label"></span>
            </div>
            <button class="cascade-change-btn hidden" id="change-student-btn">Change</button>
          </div>
          <div class="cascade-body" id="body-student">
            <div class="cascade-search">
              <span class="search-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
              <input type="text" id="search-student" placeholder="Search your name..." autocomplete="off" />
            </div>
            <div class="options-grid" id="list-student" role="list" aria-label="Students">
              <div class="opts-empty">Select a batch first</div>
            </div>
          </div>
        </div>
      </div>

      <!-- --- SECTION 5: PIN Entry --- -->
      <div class="cascade-section" id="sec-pin">
        <div class="cascade-inner">
          <div class="cascade-header">
            <div class="cascade-step-num" id="step-num-5">5</div>
            <div class="cascade-title-wrap">
              <span class="cascade-label">PIN</span><span class="cascade-colon">:</span>
            </div>
          </div>
          <div class="pin-section">
            <p class="pin-welcome" id="pin-welcome-text">Welcome! Please enter your 4-digit PIN.</p>
            <div class="pin-row" role="group" aria-label="4-digit PIN">
              <input class="pin-digit" id="pin-0" type="tel" inputmode="numeric" maxlength="1" aria-label="PIN digit 1" autocomplete="off" />
              <input class="pin-digit" id="pin-1" type="tel" inputmode="numeric" maxlength="1" aria-label="PIN digit 2" autocomplete="off" />
              <input class="pin-digit" id="pin-2" type="tel" inputmode="numeric" maxlength="1" aria-label="PIN digit 3" autocomplete="off" />
              <input class="pin-digit" id="pin-3" type="tel" inputmode="numeric" maxlength="1" aria-label="PIN digit 4" autocomplete="off" />
            </div>
            <div class="pin-actions">
              <button class="btn-signin" id="login-btn" disabled>
                <span id="login-btn-text">Sign In</span>
              </button>
              <p class="forgot-pin-text">Forgot your PIN? Contact your teacher.</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Remember Me Banner (Under PIN) -->
      <div class="remember-me-banner" id="remember-me-banner" role="button" tabindex="0" aria-label="Toggle remember login">
        <div class="rmb-left">
          <span class="rmb-text">Remember me on this device</span>
        </div>
        <div class="rmb-toggle" id="rmb-toggle" role="switch" aria-checked="false"></div>
      </div>

      <div class="clear-session-link" id="clear-session-link" tabindex="0" role="button" aria-label="Clear saved login">
        Clear saved login info
      </div>

      <!-- Single Admin Access Gear -->
      <div class="admin-gear-wrap">
        <a href="admin.html" id="admin-portal-link" class="admin-gear-link" title="Tutor's Room" aria-label="Tutor's Room"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></a>
      </div>

    </div>
  </div>

  <script type="module" src="./js/auth.js?v=20261114_v481"></script>
  <!-- PWA Service Worker & Install Handler -->
  <script type="module" src="./js/pwa.js?v=20261116_v548"></script>

  <div id="bottom-ad-banner" class="topscore-locked-banner">
    <span class="banner-brand">TopsCore</span>&nbsp;<span class="banner-author">by Mr. Top</span>
  </div>
</body>
</html>
