  <title>Student Gate — TOPS CORE</title>
  <meta name="description" content="Login to Student Gate on TOPS CORE to access your English tests, track your progress, and complete tests." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/auth.css?v=20261125_v680" />
  <!-- Instant Transition Prefetch Pipeline (Prefetch next screens while user enters credentials) -->
  <link rel="prefetch" href="dashboard.html" />
  <link rel="prefetch" href="css/dashboard.css" />
  <link rel="prefetch" href="js/dashboard.js" />
  <!-- Web App Manifest & PWA Metadata -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#060911" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TopsCore" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
</head>
<body class="notranslate" translate="no">


  <!-- Ambient orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

   <!-- --- ONE-PAGE LOGIN --- -->
  <div class="login-page">
    <div class="login-wrapper" role="main">
      <!-- Brand -->
      <div class="login-brand">
        <h1 class="brand-title">TOPS<span class="brand-core">CORE</span></h1>
      </div>

      <!-- --- SECTION 1: Institution --- -->
      <div class="cascade-section unlocked" id="sec-institution">
        <div class="cascade-inner">
          <div class="cascade-header">
            <div class="cascade-title-wrap">
              <span class="cascade-label">Institution</span><span class="cascade-colon">:</span>
              <span class="cascade-selection-label" id="sel-institution-label"></span>
            </div>
            <button class="cascade-change-btn hidden" id="change-institution-btn" title="Change Institution" aria-label="Change Institution">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/><path d="M9 9v.01"/><path d="M9 12v.01"/><path d="M9 15v.01"/><path d="M9 18v.01"/></svg>
            </button>
          </div>
          <div class="cascade-body" id="body-institution">
            <div class="cascade-search">
              <span class="search-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
              <input type="text" id="search-institution" placeholder="Search institution..." autocomplete="off" />
            </div>
            <div class="options-grid" id="list-institution" role="list" aria-label="Institutions">
              <div class="opts-spinner"><div class="spinner"></div></div>
            </div>
          </div>
        </div>
      </div>

      <!-- --- SECTION 2: Class --- -->
      <div class="cascade-section" id="sec-program">
        <div class="cascade-inner">
          <div class="cascade-header">
            <div class="cascade-title-wrap">
              <span class="cascade-label">Program</span><span class="cascade-colon">:</span>
              <span class="cascade-selection-label" id="sel-program-label"></span>
            </div>
            <button class="cascade-change-btn hidden" id="change-program-btn" title="Change Program" aria-label="Change Program">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            </button>
          </div>
          <div class="cascade-body" id="body-program">
            <div class="cascade-search">
              <span class="search-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
              <input type="text" id="search-program" placeholder="Search program..." autocomplete="off" />
            </div>
            <div class="options-grid" id="list-program" role="list" aria-label="Programs">
              <div class="opts-empty">Select an institution first</div>
            </div>
          </div>
        </div>
      </div>

      <!-- --- SECTION 3: Batch --- -->
      <div class="cascade-section" id="sec-batch">
        <div class="cascade-inner">
          <div class="cascade-header">
            <div class="cascade-title-wrap">
              <span class="cascade-label">Batch</span><span class="cascade-colon">:</span>
              <span class="cascade-selection-label" id="sel-batch-label"></span>
            </div>
            <button class="cascade-change-btn hidden" id="change-batch-btn" title="Change Batch" aria-label="Change Batch">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </button>
          </div>
          <div class="cascade-body" id="body-batch">
            <div class="cascade-search">
              <span class="search-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
              <input type="text" id="search-batch" placeholder="Search batch..." autocomplete="off" />
            </div>
            <div class="options-grid" id="list-batch" role="list" aria-label="Batches">
              <div class="opts-empty">Select a program first</div>
            </div>
          </div>
        </div>
      </div>

      <!-- --- SECTION 4: Student Name --- -->
      <div class="cascade-section" id="sec-student">
        <div class="cascade-inner">
          <div class="cascade-header">
            <div class="cascade-title-wrap">
              <span class="cascade-label">Name</span><span class="cascade-colon">:</span>
              <span class="cascade-selection-label" id="sel-student-label"></span>
            </div>
            <button class="cascade-change-btn hidden" id="change-student-btn" title="Change Name" aria-label="Change Name">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </button>
          </div>
          <div class="cascade-body" id="body-student">
            <div class="cascade-search">
              <span class="search-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
              <input type="text" id="search-student" placeholder="Search your name..." autocomplete="off" />
            </div>
            <div class="options-grid" id="list-student" role="list" aria-label="Students">
              <div class="opts-empty">Select a batch first</div>
            </div>
          </div>
        </div>
      </div>

      <!-- --- SECTION 5: PIN Entry --- -->
      <div class="cascade-section" id="sec-pin">
        <div class="cascade-inner">
          <div class="cascade-header">
            <div class="cascade-title-wrap">
              <span class="cascade-label">PIN</span><span class="cascade-colon">:</span>
              <span class="pin-inline-hint" id="pin-welcome-text">Enter your 4-digit PIN.</span>
            </div>
          </div>
          <div class="pin-section">
            <div class="pin-row" role="group" aria-label="4-digit PIN">
              <input class="pin-digit" id="pin-0" type="tel" inputmode="numeric" maxlength="1" aria-label="PIN digit 1" autocomplete="off" />
              <input class="pin-digit" id="pin-1" type="tel" inputmode="numeric" maxlength="1" aria-label="PIN digit 2" autocomplete="off" />
              <input class="pin-digit" id="pin-2" type="tel" inputmode="numeric" maxlength="1" aria-label="PIN digit 3" autocomplete="off" />
              <input class="pin-digit" id="pin-3" type="tel" inputmode="numeric" maxlength="1" aria-label="PIN digit 4" autocomplete="off" />
            </div>
            <div class="pin-actions">
              <button class="btn-signin" id="login-btn" disabled>
                <span id="login-btn-text">Sign In</span>
              </button>
              <p class="forgot-pin-text">Forgot your PIN? Contact your teacher.</p>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script type="module" src="./js/auth.js?v=20261125_v680"></script>
  <!-- PWA Service Worker & Install Handler -->
  <script type="module" src="./js/pwa.js?v=20261125_v681"></script>

  <div id="bottom-ad-banner" class="topscore-locked-banner">
    <button type="button" id="app-sync-btn" class="bottom-bar-btn app-sync-btn" title="Refresh App" aria-label="Refresh App">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
    </button>
    <div class="bottom-bar-center">
      <span class="banner-brand">TopsCore</span>&nbsp;<span class="banner-author">by Mr. Top</span>
    </div>
    <a href="admin.html" id="admin-portal-link" class="bottom-bar-btn admin-gear-link" title="Tutor's Room" aria-label="Tutor's Room">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </a>
  </div>
</body>
</html>
