<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="google" content="notranslate">
  <meta name="googlebot" content="notranslate">
  <meta name="robots" content="notranslate">
  <meta http-equiv="Content-Language" content="en">
  <title>TopsCore — Connection Offline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=20261102_v103">
  <style>
    body {
      background: #060b18;
      color: #f8fafc;
      font-family: var(--font-body, 'Inter', sans-serif);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .offline-card {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 36px 28px;
      max-width: 430px;
      width: 100%;
      box-shadow: 0 20px 35px -5px rgba(0, 0, 0, 0.6);
    }
    .offline-icon {
      font-size: 40px;
      margin-bottom: 16px;
      display: inline-block;
      animation: float 2s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    h1 {
      font-family: var(--font-display, 'Inter', sans-serif);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 10px;
      color: #ffffff;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin: 0 0 24px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(var(--grade-c-rgb), 0.15);
      border: 1px solid rgba(var(--grade-c-rgb), 0.4);
      color: var(--grade-c);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 9999px;
      margin-bottom: 20px;
    }
    .btn-retry {
      background: #3b82f6;
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-retry:hover {
      background: #2563eb;
    }
    .btn-retry:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body class="notranslate" translate="no">
  <div class="offline-card">
    <div class="offline-icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="tc-icon"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg></div>
    <div class="status-badge">
      <span>●</span> Offline Mode Active
    </div>
    <h1>No Internet Connection</h1>
    <p>
      You are currently disconnected. Don't worry — your current test answers and session progress are preserved locally in your browser.
    </p>
    <button class="btn-retry" onclick="window.location.reload()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="tc-icon" style="vertical-align:-0.15em;margin-right:6px;"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>Retry Connection
    </button>
  </div>
</body>
</html>
