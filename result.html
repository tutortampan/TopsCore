<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      try {
        var raw = sessionStorage.getItem('topscore_session');
        var adminRaw = sessionStorage.getItem('topscore_admin_session') || localStorage.getItem('topscore_admin_session');
        if (adminRaw) return;
        var sess = raw ? JSON.parse(raw) : null;
        if (!sess || !sess.student_id) { window.location.replace('index.html'); }
      } catch (_) { window.location.replace('index.html'); }
    })();
  </script>
  <title>Result - TOPS CORE</title>
  <meta name="description" content="View your Test results and answer breakdown on TOPS CORE." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Outfit:wght@400;600;700;800;900&amp;display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=20261101_v74" />
  <link rel="stylesheet" href="css/dashboard.css?v=20261101_v74" />
  <link rel="stylesheet" href="css/result.css?v=20261101_v74" />
</head>

<body class="result-page">

  <canvas id="bg-particle-canvas" class="bg-particle-canvas"></canvas>
  <div id="toast-container"></div>

  <header class="dashboard-header" id="result-page-header">
    <div class="dashboard-header-brand" id="result-header-brand">RESULT PAGE</div>
  </header>

  <canvas id="confetti-canvas" class="confetti-canvas"></canvas>

  <div id="result-loading" class="result-loading-overlay">
    <div class="spinner"></div>
    <p class="result-loading-text">Loading your results...</p>
  </div>

  <div id="result-content" class="hidden">
    <section class="result-hero" id="result-hero-section">

      <!-- 1. Header Card (Student & Class Identity - Pure Identity Card) -->
      <div class="result-identity-card cascade-item" id="result-identity-card">
        <!-- Institutional Metadata -->
        <div class="result-meta-wrapper" id="result-meta-wrapper">
          <span id="meta-inst">CAKE ENGLISH COURSE</span>
          <span class="meta-sep">|</span>
          <span id="meta-prog">CAMP</span>
          <span class="meta-sep">|</span>
          <span id="meta-batch">133</span>
          <span class="meta-sep">|</span>
          <span id="meta-lvl">3RD LEVEL</span>
        </div>

        <div class="hero-divider"></div>

        <!-- Centered Large Avatar (Static / Non-clickable with Dynamic Grade Ring) -->
        <div class="result-avatar-stage" id="result-avatar-stage">
          <span id="result-crown-badge" class="avatar-crown-badge hidden" title="Batch Champion">&#128081;</span>
          <div id="result-avatar-container" class="banner-avatar-container" title="Profile Photo">
            <span id="result-avatar-initial">S</span>
            <img id="result-avatar-img" class="hidden result-avatar-img" alt="Profile Photo" />
          </div>
        </div>

        <div class="hero-divider hero-name-divider"></div>

        <!-- Centered Student Name -->
        <div class="result-student-name-label" id="result-student-name-label">Student</div>
      </div>

      <!-- 2. Test Title (2-Line: Type/Name & Topic/Theme) -->
      <div class="result-test-title-wrap cascade-item" id="result-Test-name-container">
        <div class="result-title-row-type" id="result-asm-type-row">TEST TITLE</div>
        <div class="result-title-row-topic" id="result-asm-topic-row">TOPIC / THEME</div>
        <span id="result-Test-name" class="hidden"></span>
      </div>

      <!-- 3. Dynamic Vertical Metrics Table (Stacked: CORRECT, PARTIAL, INCORRECT, POINTS) -->
      <div class="result-metrics-table-card cascade-item" id="result-metrics-bar">
        <!-- Row 1: CORRECT -->
        <div class="metric-stacked-row metric-row-correct summary-clickable cascade-metric-row" id="card-filter-correct"
          title="Click to view correct answers">
          <span class="metric-stacked-lbl">CORRECT</span>
          <span class="metric-stacked-val" id="res-correct">0</span>
        </div>
        <!-- Row 2: PARTIAL -->
        <div class="metric-stacked-row metric-row-partial summary-clickable cascade-metric-row" id="card-filter-partial"
          title="Click to view partial answers">
          <span class="metric-stacked-lbl">PARTIAL</span>
          <span class="metric-stacked-val" id="res-partial">0</span>
        </div>
        <!-- Row 3: INCORRECT -->
        <div class="metric-stacked-row metric-row-wrong summary-clickable cascade-metric-row" id="card-filter-wrong"
          title="Click to view incorrect answers">
          <span class="metric-stacked-lbl">INCORRECT</span>
          <span class="metric-stacked-val" id="res-wrong">0</span>
        </div>
        <!-- Row 4: POINTS -->
        <div class="metric-stacked-row metric-row-points cascade-metric-row" id="result-points-box"
          title="Total Points Earned">
          <span class="metric-stacked-lbl">POINTS</span>
          <span class="metric-stacked-val" id="res-points">0</span>
        </div>
      </div>

      <!-- 4. Dual Score & Grade Card (Side-by-Side Symmetrical - 50px) -->
      <div class="result-score-grade-card cascade-item" id="result-score-grade-card">
        <!-- Kotak Score Bersih -->
        <div class="score-grade-box score-box" id="result-score-box">
          <span class="score-grade-val" id="result-percentage">0%</span>
        </div>
        <!-- Kotak Grade Bersih -->
        <div class="score-grade-box grade-box" id="result-grade-box">
          <span class="score-grade-val grade-delayed" id="result-grade-val">&mdash;</span>
        </div>
      </div>

      <!-- 5. Evaluation / Motivation Word Card (FAIL / LESS / ENOUGH / GOOD / VERY GOOD / EXCELLENT - 50px) -->
      <div class="result-evaluation-card cascade-item" id="result-motivation-msg">&mdash;</div>


      <!-- 6. Actions (Next Milestone/Remedial 50px, Back 30px, Breakdown 30px) -->
      <div class="result-action-buttons-wrap cascade-item" id="result-actions-container">
        <div id="smart-next-action-container" class="cascade-btn-item"></div>
        <button class="btn btn-primary hidden" id="try-again-btn">Try Again</button>
        <a href="dashboard.html" class="btn btn-dashboard-primary cascade-btn-item" id="back-dashboard-btn">BACK TO
          LOBBY</a>
        <button class="btn btn-breakdown-ghost cascade-btn-item" id="toggle-answers-btn">VIEW ANSWER BREAKDOWN</button>
      </div>
    </section>

    <div class="answers-modal-backdrop hidden" id="answers-section" role="dialog" aria-modal="true"
      aria-label="Answer Breakdown Modal">
      <div class="answers-modal-card">
        <div class="answers-modal-header">
          <div class="answers-modal-title-wrap">
            <h2 class="answers-modal-title">&#128203; Answer Breakdown</h2>
            <span class="answers-modal-subtitle" id="modal-answers-count-label">Review your detailed question
              responses</span>
          </div>
          <button class="answers-modal-close-btn" id="close-answers-modal-btn" type="button"
            aria-label="Close">&#10005;</button>
        </div>
        <div class="answers-modal-scroll-body">
          <div id="answers-list-container"></div>
        </div>
        <div class="answers-modal-footer">
          <button class="btn btn-secondary answers-modal-done-btn" id="done-answers-modal-btn" type="button">Close
            Breakdown</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/result.js?v=20261101_v74"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=20261101_v74').then(r => r.update()).catch(e => console.warn('SW:', e));
      });
    }
  </script>
  <footer id="bottom-ad-banner" class="topscore-locked-banner">
    <span class="banner-brand">TopsCore</span>&nbsp;&copy; 2026&nbsp;<span class="banner-sep">|</span>&nbsp;<span
      class="banner-author">Created by Mr. Top</span>
  </footer>
</body>

</html>
