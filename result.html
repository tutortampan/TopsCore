<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function() {
      try {
        var raw = sessionStorage.getItem('topscore_session');
        var adminRaw = sessionStorage.getItem('topscore_admin_session') || localStorage.getItem('topscore_admin_session');
        if (adminRaw) return; // Admin authorized
        var sess = raw ? JSON.parse(raw) : null;
        if (!sess || !sess.student_id) {
          window.location.replace('index.html');
        }
      } catch (_) {
        window.location.replace('index.html');
      }
    })();
  </script>
  <title>Result — TOPS CORE</title>
  <meta name="description" content="View your Assessment results and answer breakdown on TOPS CORE." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=5.3.2" />
  <link rel="stylesheet" href="css/dashboard.css?v=5.3.2" />
  <link rel="stylesheet" href="css/result.css?v=5.3.2" />
</head>
<body class="result-page">



  <div id="toast-container"></div>

  <!-- Header -->
  <header class="dashboard-header" style="justify-content: center;">
    <div class="dashboard-header-brand">🎓 TOPS CORE</div>
  </header>

  <div id="result-loading" class="empty-state" style="padding:var(--space-16);">
    <div class="spinner"></div>
    <p>Loading your results...</p>
  </div>

  <div id="result-content" class="hidden">

    <!-- Result Hero -->
    <section class="result-hero" id="result-hero-section">
      <div style="display:flex; justify-content:center; align-items:center; gap: clamp(1rem, 3vw, 1.5rem); margin-bottom: 1rem;">
        <!-- Photo -->
        <div id="result-avatar-container" style="width: clamp(64px, 15vw, 80px); height: clamp(64px, 15vw, 80px); min-width: 64px; flex-shrink: 0; border-radius: 20px; overflow: hidden; background: linear-gradient(135deg, var(--clr-primary, #6366f1), var(--clr-accent-1, #ec4899)); display: flex; align-items: center; justify-content: center; font-size: clamp(1.5rem, 5vw, 2rem); font-weight: 800; color: #fff; border: 3px solid var(--clr-accent-1, #ec4899); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.25), 0 8px 24px rgba(0,0,0,0.4); transition: all 0.4s ease;">
          <span id="result-avatar-initial">S</span>
          <img id="result-avatar-img" class="hidden" alt="Profile Photo" style="width:100%;height:100%;object-fit:cover;" />
        </div>

        <!-- Grade -->
        <div class="result-grade-display grade-S" id="result-grade-badge" style="margin-bottom: 0 !important; width: clamp(64px, 15vw, 80px) !important; height: clamp(64px, 15vw, 80px) !important; min-width: 64px !important; flex-shrink: 0 !important; font-size: clamp(2rem, 8vw, 2.8rem) !important; border-radius: 20px !important;">—</div>
      </div>

      <div class="result-percentage" id="result-percentage">0%</div>
      <!-- Headline removed per spec -->
      <div id="result-Assessment-name-container" style="max-width: 100%;">
        <div id="result-Assessment-name"></div>
      </div>
      <div id="result-best-score-badge" style="text-align:center;margin-bottom:0.75rem;"></div>

      <!-- Total Points -->
      <div style="text-align:center; margin-bottom:1rem;">
        <div id="result-points-box" style="display:inline-flex; align-items:center; gap:8px; background:rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.3); border-radius:12px; padding:10px 15px; transition: all 0.4s ease;">
          <span style="font-size:0.85rem; color:rgba(255,255,255,0.8); text-transform:uppercase; letter-spacing:1px; font-weight:700;">Total Points:</span>
          <span id="res-points" style="font-size:1.2rem; font-weight:800; line-height:1; color: #818cf8; transition: all 0.4s ease;">0</span>
        </div>
      </div>

      <!-- Summary Grid -->
      <div class="result-summary-grid" style="display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-bottom:1.5rem;">
        <div class="result-summary-item" style="background:#0e1f38; border:1px solid rgba(255,255,255,0.08); border-radius:8px; padding:10px 12px; display:inline-flex; align-items:center; gap:6px;">
          <span style="font-size:0.75rem; color:rgba(255,255,255,0.7); text-transform:uppercase; letter-spacing:1px; font-weight:800;">Correct:</span>
          <span class="text-success" id="res-correct" style="font-size:1.1rem; font-weight:900; line-height:1;">0</span>
        </div>
        <div class="result-summary-item" style="background:#0e1f38; border:1px solid rgba(255,255,255,0.08); border-radius:8px; padding:10px 12px; display:inline-flex; align-items:center; gap:6px;">
          <span style="font-size:0.75rem; color:rgba(255,255,255,0.7); text-transform:uppercase; letter-spacing:1px; font-weight:800;">Partial:</span>
          <span class="text-warning" id="res-partial" style="font-size:1.1rem; font-weight:900; line-height:1;">0</span>
        </div>
        <div class="result-summary-item" style="background:#0e1f38; border:1px solid rgba(255,255,255,0.08); border-radius:8px; padding:10px 12px; display:inline-flex; align-items:center; gap:6px;">
          <span style="font-size:0.75rem; color:rgba(255,255,255,0.7); text-transform:uppercase; letter-spacing:1px; font-weight:800;">Incorrect:</span>
          <span class="text-danger" id="res-wrong" style="font-size:1.1rem; font-weight:900; line-height:1;">0</span>
        </div>
      </div>

      <div class="d-flex gap-3" style="flex-direction: column; max-width: 320px; margin: 0 auto;">
        <!-- Primary -->
        <button class="btn btn-primary" id="try-again-btn" style="background: var(--clr-primary, #6366f1); border:none; padding: 14px; font-weight: 800; font-size: 1rem; border-radius: 8px; letter-spacing: 0.5px; width: 100%; color: #fff;">Try Again</button>
        <!-- Secondary -->
        <button class="btn btn-secondary" id="toggle-answers-btn" style="background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 14px; font-weight: 700; font-size: 0.95rem; border-radius: 8px; width: 100%;">View Answer Breakdown</button>
        <!-- Tertiary -->
        <div style="display: flex; gap: 12px; width: 100%; margin-top: 4px;">
          <a href="dashboard.html" class="btn btn-ghost" style="flex:1; background:transparent; color:#94a3b8; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; border:none; text-align: center; text-decoration: none;">Back</a>
          <button class="btn btn-ghost" id="print-result-btn" style="flex:1; background:transparent; color:#94a3b8; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; border:none; text-align: center;">Print</button>
        </div>
      </div>
    </section>

    <!-- Answers Breakdown -->
    <section class="answers-list hidden" id="answers-section" aria-label="Answer breakdown">
      <h2 class="text-center mb-6 fw-700">Answer Breakdown</h2>
      <div id="answers-list-container"></div>
    </section>

  </div>

  <script type="module" src="./js/result.js?v=5.3.2"></script>
  <!-- Service Worker Registration for PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=5.3.2')
          .then(registration => {
            registration.update();
            console.log('ServiceWorker registered and updated with scope:', registration.scope);
          })
          .catch(error => console.warn('ServiceWorker registration failed:', error));
      });
    }
  </script>



  <div id="bottom-ad-banner" class="topscore-locked-banner">
    <span style="color:#38bdf8; font-weight:800; letter-spacing:0.04em;">TopsCore</span>&nbsp;&copy; 2026&nbsp;<span style="opacity:0.4; margin:0 6px;">|</span>&nbsp;<span style="color:#cbd5e1;">Created by Mr. Top</span>
  </div>
</body>
</html>
