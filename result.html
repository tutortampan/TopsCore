<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        var fromAdmin = params.get('admin') === '1' || params.get('is_admin') === 'true' || params.get('from') === 'admin' || params.get('mode') === 'tutor';
        var adminRaw = sessionStorage.getItem('topscore_admin_session') || localStorage.getItem('topscore_admin_session');
        if (fromAdmin || adminRaw) return;
        var raw = sessionStorage.getItem('topscore_session');
        var sess = raw ? JSON.parse(raw) : null;
        if (!sess || !sess.student_id) { window.location.replace('index.html'); }
      } catch (_) { window.location.replace('index.html'); }
    })();
  </script>
  <title>Result Page — TOPS CORE</title>
  <meta name="description" content="View your test results, score breakdown, and achievements on the TOPS CORE Result Page." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Outfit:wght@400;600;700;800;900&amp;display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=20261115_v522" />
  <link rel="stylesheet" href="css/dashboard.css?v=20261117_v625" />
  <link rel="stylesheet" href="css/result.css?v=20261118_v630" />
  <!-- Web App Manifest & PWA Metadata -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#060911" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TopsCore" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
</head>

<body class="result-page">

  <canvas id="bg-particle-canvas" class="bg-particle-canvas"></canvas>
  <div id="toast-container"></div>

  <header class="dashboard-header" id="result-page-header">
    <div class="result-test-title-wrap" id="result-Test-name-container">
      <div class="result-title-row-type" id="result-test-type-row">RESULT PAGE</div>
      <div class="result-title-row-topic" id="result-test-topic-row"></div>
      <span id="result-Test-name" class="hidden"></span>
    </div>
  </header>

  <canvas id="confetti-canvas" class="confetti-canvas"></canvas>

  <div id="result-loading" class="result-loading-overlay">
    <div class="spinner"></div>
    <p class="result-loading-text">Loading your results...</p>
  </div>

  <div id="result-content" class="hidden">
    <section class="result-hero" id="result-hero-section">

      <!-- 1. Header Card: Unified Hero Card (Option A SSOT - Phase 622) -->
      <div class="result-identity-card cascade-item unified-hero-card" id="result-identity-card">
        <!-- 1. Top Identity: Centered Name & Academic Hierarchy -->
        <div class="hero-identity-top">
          <div class="result-student-name-label hero-student-name" id="result-student-name-label">Student</div>
          <div class="result-meta-wrapper hero-academic-meta" id="result-meta-wrapper">
            <span id="meta-inst">CEC</span>
            <span class="meta-sep">&bull;</span>
            <span id="meta-prog">CAMP</span>
            <span class="meta-sep">&bull;</span>
            <span id="meta-batch">131</span>
            <span class="meta-sep">&bull;</span>
            <span id="meta-lvl">3RD LEVEL</span>
          </div>
        </div>

        <!-- Subtle Accent Divider -->
        <div class="hero-card-divider hero-name-divider"></div>

        <!-- 2. Bottom Row: 3:4 Portrait Photo (Left) + Biodata Table (Right) -->
        <div class="hero-body-row">
          <!-- Photo Container Left -->
          <div class="result-avatar-stage banner-avatar-wrapper" id="result-avatar-stage">
            <span id="result-crown-badge" class="avatar-crown-badge hidden" title="Batch Champion">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"></path></svg>
            </span>
            <div id="result-avatar-container" class="hero-avatar-3x4" title="Profile Photo">
              <span id="result-avatar-initial">S</span>
              <img id="result-avatar-img" class="hidden result-avatar-img" alt="Profile Photo" />
            </div>
          </div>

          <!-- Biodata Table Right: Sex -> DoB -> Age -> Adr with Aligned Colons -->
          <div class="hero-bio-table">
            <!-- Row 1: Sex (Above DoB per user requirement) -->
            <div class="hero-bio-row">
              <span class="hero-bio-lbl">Sex</span>
              <span class="hero-bio-colon">:</span>
              <span class="hero-bio-val hero-bio-gender-val" id="result-hero-gender">—</span>
            </div>
            <!-- Row 2: DoB -->
            <div class="hero-bio-row">
              <span class="hero-bio-lbl">DoB</span>
              <span class="hero-bio-colon">:</span>
              <span class="hero-bio-val" id="result-hero-dob">—</span>
            </div>
            <!-- Row 3: Age -->
            <div class="hero-bio-row">
              <span class="hero-bio-lbl">Age</span>
              <span class="hero-bio-colon">:</span>
              <span class="hero-bio-val" id="result-hero-age">—</span>
            </div>
            <!-- Row 4: Adr -->
            <div class="hero-bio-row hero-bio-adr-row">
              <span class="hero-bio-lbl">Adr</span>
              <span class="hero-bio-colon">:</span>
              <span class="hero-bio-val hero-bio-adr-val" id="result-hero-adr" title="Residential Address">—</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 2. Dynamic Vertical Metrics Table (Dinamis di sisa layar) -->
      <div class="result-metrics-composite-card cascade-item" id="result-metrics-composite-card">
        <div class="result-metrics-table-inner" id="result-metrics-bar">
          <!-- Row 1: CORRECT -->
          <div class="metric-stacked-row metric-row-correct summary-clickable cascade-metric-row" id="card-filter-correct"
            title="Click to view correct answers">
            <span class="metric-stacked-lbl">CORRECT</span>
            <span class="metric-stacked-val" id="res-correct">0</span>
          </div>
          <!-- Row 2: PARTIAL -->
          <div class="metric-stacked-row metric-row-partial summary-clickable cascade-metric-row" id="card-filter-partial"
            title="Click to view partial answers">
            <span class="metric-stacked-lbl">PARTIAL</span>
            <span class="metric-stacked-val" id="res-partial">0</span>
          </div>
          <!-- Row 3: INCORRECT -->
          <div class="metric-stacked-row metric-row-wrong summary-clickable cascade-metric-row" id="card-filter-wrong"
            title="Click to view incorrect answers">
            <span class="metric-stacked-lbl">INCORRECT</span>
            <span class="metric-stacked-val" id="res-wrong">0</span>
          </div>
          <!-- Row 4: POINTS -->
          <div class="metric-stacked-row metric-row-points summary-clickable cascade-metric-row" id="result-points-box"
            title="Total Points Earned — Click to view all answers">
            <span class="metric-stacked-lbl">POINTS</span>
            <span class="metric-stacked-val" id="res-points">0</span>
          </div>
        </div>
      </div>

      <!-- 3. Dual Score & Grade Row (Strict 50px - 2 Symmetrical Columns: Score % | Grade Symbol) -->
      <div class="result-score-grade-row cascade-item" id="result-score-grade-card">
        <!-- Col 1: Score (Percentage) -->
        <div class="score-grade-box score-box" id="result-score-box">
          <span class="score-grade-val" id="result-percentage">0%</span>
        </div>

        <!-- Col 2: Grade Symbol (★ / A / B / C / D / E) -->
        <div class="score-grade-box grade-box" id="result-grade-box">
          <span class="score-grade-val grade-delayed" id="result-grade-val">&mdash;</span>
        </div>
      </div>

      <!-- 4. Grade Description Card (Strict 50px - Muncul setelah animasi grade muncul) -->
      <div class="result-grade-desc-card cascade-item" id="result-motivation-msg">
        <span class="grade-predicate-text" id="result-predicate-text">&mdash;</span>
      </div>

      <!-- 5. Actions (Strict 50px Smart Next Action & Strict 50px Back to Class / Room) -->
      <div class="result-action-slot cascade-item" id="smart-next-action-container"></div>
      <a href="dashboard.html" class="btn btn-dashboard-primary cascade-item" id="back-dashboard-btn">BACK TO CLASS</a>

      <!-- Hidden compatibility elements -->
      <button class="btn btn-primary hidden" id="try-again-btn">Try Again</button>
    </section>

    <div class="answers-modal-backdrop hidden" id="answers-section" role="dialog" aria-modal="true"
      aria-label="Answer Breakdown Modal">
      <div class="answers-modal-card">
        <!-- 1. Header (Title Area 40px per Invariant 1.5.1) -->
        <div class="answers-modal-header title-area">
          <h2 class="answers-modal-title">ANSWER BREAKDOWN</h2>
        </div>
        <!-- 2. Scrollable Body Area -->
        <div class="answers-modal-scroll-body">
          <div id="answers-list-container"></div>
        </div>
        <!-- 3. CTA Area / Modal Footer (60px Panel per Invariant 1.5.2 & 1.5.4) -->
        <div class="answers-modal-footer modal-footer">
          <button class="btn answers-modal-done-btn" id="done-answers-modal-btn" type="button" onclick="document.getElementById('answers-section')?.classList.add('hidden')">CLOSE</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/result.js?v=20261118_v629"></script>
  <!-- PWA Service Worker & Install Handler -->
  <script type="module" src="./js/pwa.js?v=20261116_v548"></script>
  <footer id="bottom-ad-banner" class="topscore-locked-banner">
    <span class="banner-brand">TopsCore</span>&nbsp;<span class="banner-author">by Mr. Top</span>
  </footer>
</body>

</html>
