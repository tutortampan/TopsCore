<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function() {
      try {
        var raw = sessionStorage.getItem('topscore_session');
        var adminRaw = sessionStorage.getItem('topscore_admin_session') || localStorage.getItem('topscore_admin_session');
        if (adminRaw) return;
        var sess = raw ? JSON.parse(raw) : null;
        if (!sess || !sess.student_id) { window.location.replace('index.html'); }
      } catch (_) { window.location.replace('index.html'); }
    })();
  </script>
  <title>Result - TOPS CORE</title>
  <meta name="description" content="View your Assessment results and answer breakdown on TOPS CORE." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Outfit:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=5.4.4" />
  <link rel="stylesheet" href="css/dashboard.css?v=5.4.4" />
  <link rel="stylesheet" href="css/result.css?v=5.4.4" />
</head>
<body class="result-page">

  <canvas id="bg-particle-canvas" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; opacity:0.35;"></canvas>
  <div id="toast-container"></div>

  <header class="dashboard-header" style="justify-content: center; position: relative; z-index: 10;">
    <div class="dashboard-header-brand">&#127891; TOPS CORE</div>
  </header>

  <canvas id="confetti-canvas" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:9999;"></canvas>

  <div id="result-loading" class="empty-state" style="position:relative; z-index:5; padding:var(--space-16);">
    <div class="spinner"></div>
    <p>Loading your results...</p>
  </div>

  <div id="result-content" class="hidden" style="position:relative; z-index:5;">
    <section class="result-hero" id="result-hero-section">

      <div id="result-Assessment-name-container" class="result-meta-title-bar" style="opacity:0; animation: result-fade-up 0.4s 0.08s ease forwards;">
        <span id="result-curriculum-crumb" class="result-curriculum-crumb"></span>
        <div class="result-title-row">
          <span id="result-Assessment-name"></span>
          <span id="result-best-score-badge"></span>
        </div>
      </div>

      <!-- Hero Trio Row: Photo, Score, and Grade Side-by-Side ("Berderet") -->
      <div class="result-hero-trio-row" id="result-hero-trio-row" style="opacity:0; animation: result-fade-up 0.45s 0.14s ease forwards;">
        <!-- 1. Student Portrait Stage -->
        <div class="result-portrait-stage">
          <div id="result-crown-badge" class="result-crown-badge hidden" title="Batch Champion">&#128081;</div>
          <div class="result-score-ring-wrapper" id="result-score-ring-wrapper">
            <svg class="result-score-ring-svg" viewBox="0 0 110 110" xmlns="http://www.w3.org/2000/svg">
              <circle class="ring-track" cx="55" cy="55" r="50" />
              <circle class="ring-progress" id="ring-progress-circle" cx="55" cy="55" r="50" />
            </svg>
            <div id="result-avatar-container" class="result-avatar-circle">
              <span id="result-avatar-initial">S</span>
              <img id="result-avatar-img" class="hidden" alt="Profile Photo" />
            </div>
          </div>
        </div>

        <!-- 2. Score Stage -->
        <div class="result-score-stage">
          <div class="result-percentage" id="result-percentage">0%</div>
        </div>

        <!-- 3. Modern Gold Star Accent (★ Vector Badge) -->
        <div class="result-stamp-stage">
          <div id="result-grade-stamp" class="result-grade-stamp pure-stamp" title="Certified Achievement">
            <span id="result-grade-badge" class="stamp-grade-symbol">
              <svg class="star-accent-vector" width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="starGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#FDE047" />
                    <stop offset="100%" stop-color="#EAB308" />
                  </linearGradient>
                </defs>
                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="url(#starGoldGrad)" />
              </svg>
            </span>
          </div>
        </div>
      </div>

      <!-- Centered Student Name Beneath Trio with Balanced Spacing -->
      <div class="result-identity-bar" style="opacity:0; animation: result-fade-up 0.45s 0.2s ease forwards;">
        <div class="result-student-name-label" id="result-student-name-label"></div>
      </div>

      <!-- 4. Stacked Breakdown Metrics with Semantic Colors (Linear / Apple Glassmorphic Design) -->
      <div class="result-stats-stacked-list" id="result-metrics-bar" style="opacity:0; animation: result-fade-up 0.4s 0.28s ease forwards;">
        <!-- Row 1: Total Points -->
        <div class="stat-stacked-row stat-points" id="result-points-box" title="Total Points Earned">
          <span class="stat-row-label">Points</span>
          <span class="stat-row-value stat-val-points" id="res-points">0 PTS</span>
          <div id="result-rank-badge" class="result-rank-badge hidden"></div>
        </div>
        <!-- Row 2: Correct (Green / Hijau) -->
        <div class="stat-stacked-row stat-correct summary-clickable" id="card-filter-correct" title="Click to view correct answers">
          <span class="stat-row-label stat-lbl-correct">Correct</span>
          <span class="stat-row-value stat-val-correct" id="res-correct">0</span>
        </div>
        <!-- Row 3: Partial (Yellow / Kuning) -->
        <div class="stat-stacked-row stat-partial summary-clickable" id="card-filter-partial" title="Click to view partial answers">
          <span class="stat-row-label stat-lbl-partial">Partial</span>
          <span class="stat-row-value stat-val-partial" id="res-partial">0</span>
        </div>
        <!-- Row 4: Incorrect (Red / Merah) -->
        <div class="stat-stacked-row stat-wrong summary-clickable" id="card-filter-wrong" title="Click to view incorrect answers">
          <span class="stat-row-label stat-lbl-wrong">Incorrect</span>
          <span class="stat-row-value stat-val-wrong" id="res-wrong">0</span>
        </div>
      </div>

      <!-- Hidden compatibility hooks (no additional comment text) -->
      <div id="result-points-row" class="hidden" style="display:none !important;"></div>
      <div id="result-motivation-msg" class="hidden" style="display:none !important;"></div>
      <div id="result-attempt-meta" class="hidden" style="display:none !important;"></div>

      <div id="admin-remedial-control-container"></div>

      <div class="result-action-buttons-wrap" style="display:flex; flex-direction:column; gap:8px; max-width:380px; width:100%; margin:8px auto 0 auto; opacity:0; animation: result-fade-up 0.4s 0.45s ease forwards;">
        <div id="smart-next-action-container"></div>
        <button class="btn btn-primary hidden" id="try-again-btn" style="display:none !important;">Try Again</button>
        <a href="dashboard.html" class="btn btn-dashboard-primary" id="back-dashboard-btn">&larr; Back to Dashboard</a>
        <button class="btn btn-breakdown-ghost" id="toggle-answers-btn">View Answer Breakdown</button>
      </div>
    </section>

    <div class="answers-modal-backdrop hidden" id="answers-section" role="dialog" aria-modal="true" aria-label="Answer Breakdown Modal">
      <div class="answers-modal-card">
        <div class="answers-modal-header">
          <div class="answers-modal-title-wrap">
            <h2 class="answers-modal-title">&#128203; Answer Breakdown</h2>
            <span class="answers-modal-subtitle" id="modal-answers-count-label">Review your detailed question responses</span>
          </div>
          <button class="answers-modal-close-btn" id="close-answers-modal-btn" type="button" aria-label="Close">&#10005;</button>
        </div>
        <div class="answers-modal-scroll-body">
          <div id="answers-list-container"></div>
        </div>
        <div class="answers-modal-footer">
          <button class="btn btn-secondary answers-modal-done-btn" id="done-answers-modal-btn" type="button">Close Breakdown</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/result.js?v=5.4.4"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=5.4.4').then(r => r.update()).catch(e => console.warn('SW:', e));
      });
    }
  </script>
  <div id="bottom-ad-banner" class="topscore-locked-banner">
    <span style="color:#38bdf8; font-weight:800;">TopsCore</span>&nbsp;&copy; 2026&nbsp;<span style="opacity:0.4; margin:0 6px;">|</span>&nbsp;<span style="color:#cbd5e1;">Created by Mr. Top</span>
  </div>
</body>
</html>
